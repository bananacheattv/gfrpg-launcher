name: Release launcher

# Publie l'installeur quand la version de package.json change.
# Les launchers installés se mettent à jour tout seuls (electron-updater).
# Les mods / versions du jeu viennent du manifeste du dépôt MMORPG_MOD (aucune release nécessaire ici).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version déjà publiée ?
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'false'
        with:
          node-version: 20

      - name: Build + publication
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm install --no-audit --no-fund
          npm run release
